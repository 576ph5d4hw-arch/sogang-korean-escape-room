<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>해야 해요! 그림 문장 게임</title><style>
:root{--ink:#24324a;--blue:#4569c8;--pale:#f4f6ff}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f5f8ff,#fff8ed);font-family:'Segoe UI','Malgun Gothic',sans-serif;color:var(--ink);min-height:100vh}.wrap{max-width:860px;margin:0 auto;padding:28px 18px 48px}.top{text-align:center}.tag{display:inline-block;background:#e7edff;color:#425db3;border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px}h1{margin:12px 0 8px;font-size:clamp(28px,5vw,42px)}.sub{color:#58647c;font-size:17px;margin:0 0 20px}.instructions{max-width:650px;margin:0 auto 20px;background:white;padding:12px 18px;border-radius:14px;box-shadow:0 5px 18px #24324a12;font-size:15px;line-height:1.7}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:680px;margin:0 auto 12px;font-weight:700}.track{height:10px;background:#e3e8f3;border-radius:99px;max-width:680px;margin:0 auto 18px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#59b99a,#4569c8);transition:width .3s}.card{max-width:680px;margin:auto;background:white;border-radius:24px;padding:18px;box-shadow:0 15px 40px #27385c20}.art{height:min(55vw,340px);min-height:235px;border-radius:17px;background-size:500% 200%;background-repeat:no-repeat;background-color:#eee}.q{font-size:18px;font-weight:700;margin:15px 4px 8px}.expr{display:inline-block;border-radius:10px;padding:7px 12px;background:#fff4d9;color:#745216;font-size:18px;font-weight:800}.label{display:block;font-size:14px;font-weight:700;margin:13px 4px 7px}.input{width:100%;padding:14px 15px;border:2px solid #dce2ef;border-radius:13px;font-size:20px;outline:none}.input:focus{border-color:#7590ee}.actions{display:flex;gap:10px;margin-top:12px}.btn{border:0;border-radius:12px;padding:12px 18px;font-size:16px;font-weight:800;cursor:pointer}.check{background:var(--blue);color:#fff;flex:1}.hint{background:#edf0f6;color:#485570}.feedback{min-height:36px;margin:12px 4px 2px;font-weight:800;font-size:17px}.ok{color:#16835e}.no{color:#b74d43}.finish{text-align:center;padding:35px 15px}.finish h2{font-size:32px}.finish p{font-size:18px}.again{background:var(--blue);color:white}.footer{text-align:center;color:#68748c;font-size:13px;margin-top:18px}[hidden]{display:none!important}@media print{body{background:white}.wrap{padding:0}.top,.bar,.track,.actions,.footer{display:none}.card{box-shadow:none;border:1px solid #ccd3e0}.art{height:300px}}
</style></head><body><main class="wrap"><header class="top"><span class="tag">문법 연습 게임 · 20문제</span><h1>해야 해요! 그림 문장 게임</h1><p class="sub">그림을 보고 알맞은 문장을 써 보세요.</p><div class="instructions">표현을 보고 문장을 만들어요.<br><b>예: 화장실에 가다 → 화장실에 가야 해요.</b><br>정답을 쓰고 <b>확인</b>을 누르세요!</div></header><div class="bar"><span id="count">1 / 20</span><span>맞힌 문제 <b id="score">0</b></span></div><div class="track"><div id="fill" class="fill"></div></div><section class="card" id="game"><div id="art" class="art"></div><div class="q">그림을 보고 문장을 쓰세요.</div><div id="expr" class="expr"></div><label class="label" for="answer">문장</label><input id="answer" class="input" autocomplete="off" placeholder="예: 화장실에 가야 해요."><div class="actions"><button class="btn hint" id="hint">힌트</button><button class="btn check" id="check">확인</button></div><div id="feedback" class="feedback" aria-live="polite"></div></section><section class="card finish" id="finish" hidden></section><div class="footer">천천히 생각하고 써 보세요. 잘했어요!</div></main>
<script>
const items=[
{expr:'화장실에 가다',ans:'화장실에 가야 해요.',n:1},{expr:'커피를 마시다',ans:'커피를 마셔야 해요.',n:2},{expr:'아이스크림을 먹다',ans:'아이스크림을 먹어야 해요.',n:3},{expr:'춤을 추다',ans:'춤을 춰야 해요.',n:4},{expr:'샌드위치를 만들다',ans:'샌드위치를 만들어야 해요.',n:5},{expr:'한국어를 연습하다',ans:'한국어를 연습해야 해요.',n:6},{expr:'쉬다',ans:'쉬어야 해요.',n:7},{expr:'약을 먹다',ans:'약을 먹어야 해요.',n:8},{expr:'기다리다',ans:'기다려야 해요.',n:9},{expr:'의자가 많다',ans:'의자가 많아야 해요.',n:10},
{expr:'샤워하다',ans:'샤워해야 해요.',n:11},{expr:'표를 사다',ans:'표를 사야 해요.',n:12},{expr:'청소하다',ans:'청소해야 해요.',n:13},{expr:'역까지 걷다',ans:'역까지 걸어야 해요.',n:14},{expr:'쇼핑하다',ans:'쇼핑해야 해요.',n:15},{expr:'이 영화를 보다',ans:'이 영화를 봐야 해요.',n:16},{expr:'설명서를 읽다',ans:'설명서를 읽어야 해요.',n:17},{expr:'선생님 말을 듣다',ans:'선생님 말을 들어야 해요.',n:18},{expr:'이름을 쓰다',ans:'이름을 써야 해요.',n:19},{expr:'다시 오다',ans:'다시 와야 해요.',n:20}
];let order=[],i=0,score=0,locked=false;const $=id=>document.getElementById(id);function start(){order=[...items.keys()].sort(()=>Math.random()-.5);i=0;score=0;locked=false;$('finish').hidden=true;$('game').hidden=false;show()}function show(){locked=false;let d=items[order[i]],idx=(d.n-1)%10;let art=$('art');art.style.backgroundImage=`url('scenes-${d.n<=10?'01-10-v2':'11-20-v2'}.jpg')`;art.style.backgroundPosition=`${idx%5*25}% ${idx<5?0:100}%`;$('count').textContent=`${i+1} / ${items.length}`;$('score').textContent=score;$('fill').style.width=`${i/items.length*100}%`;$('expr').textContent=d.expr;$('answer').value='';$('feedback').textContent='';$('feedback').className='feedback';$('answer').focus()}function norm(s){return s.trim().replace(/\s+/g,'')}function check(){if(locked)return;let d=items[order[i]];if(norm($('answer').value)===norm(d.ans)){score++;locked=true;$('feedback').textContent='정답이에요! 잘했어요!';$('feedback').className='feedback ok';$('score').textContent=score;setTimeout(next,800)}else{$('feedback').textContent='다시 생각해 보세요. 힌트를 볼까요?';$('feedback').className='feedback no'}}function next(){i++;if(i>=items.length){$('game').hidden=true;$('finish').hidden=false;$('fill').style.width='100%';$('finish').innerHTML=`<h2>모두 끝났어요!</h2><p>맞힌 문제: <b>${score} / ${items.length}</b></p><p>오늘 배운 문법: <b>-아/어야 해요</b></p><button class="btn again" onclick="start()">다시 하기</button>`}else show()}$('check').onclick=check;$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()});$('hint').onclick=()=>{$('feedback').textContent='표현을 잘 보세요. 동사 뒤에 “-아/어야 해요”를 써요.';$('feedback').className='feedback'};start();
</script></body></html>
